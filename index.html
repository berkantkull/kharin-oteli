<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khar'ın Oteli</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0d0a12;color:#eee;font-family:'Press Start 2P',monospace}
  #wrap{max-width:960px;margin:0 auto;padding:12px 16px;box-sizing:border-box}
  canvas{width:100%;height:auto;display:block;background:#000;border:4px solid #2a2033;box-sizing:border-box;touch-action:manipulation}
  .btns{display:flex;gap:12px;margin-top:12px}
  .btns button{flex:1;font:inherit;font-size:13px;padding:16px 6px;border:4px solid #000;color:#fff;cursor:pointer;box-shadow:0 4px 0 #000;touch-action:manipulation}
  #bSlap{background:#c0283a}
  #bKey{background:#2a7a3a}
  #bGtr{background:#6a3aa8}
  .btns button:active{transform:translateY(4px);box-shadow:none}
  p.hint{font-size:10px;color:#9a8aa8;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div class="btns">
    <button id="bSlap">TOKAT (Z)</button>
    <button id="bGtr">GİTAR (C)</button>
    <button id="bKey">ANAHTAR (X)</button>
  </div>
  <p class="hint">Z / SPACE = TOKAT &nbsp;·&nbsp; X / ENTER = ANAHTAR VER &nbsp;·&nbsp; C = HAVA GİTARI</p>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 320, H = 180, S = 3;
const FONT = "'Press Start 2P', monospace";

// ---------- SPRITES ----------
const KHAR = [
  "....KKKKKKKK....",
  "...KKRKKKKRKK...",
  "..KKKKKKKKKKKK..",
  "..HSSSSSSSSSSH..",
  "..HSGGGSSGGGSH..",
  "..HSGWGSSGWGSH..",
  "..HSSSSSSSSSSH..",
  "..HSBBSSSSBBSH..",
  "..HSBBBBBBBBSH..",
  "..HSBBMMMMBBSH..",
  "..HSSBBBBBBSSH..",
  "..H..SBBBBS..H..",
  "..H..SSSSSS..H..",
  "...VVVTSSTVVV...",
  "..VVVTTTTTTVVV..",
  ".SVVVTTTTTTVVVS.",
  ".AVVVTTTTTTVVVA.",
  ".SVVVTTTTTTVVVS.",
  ".AVVVTTTTTTVVVA.",
  ".SVVVTTTTTTVVVS.",
];
const KLEGS_A = ["..VVVTTTTTTVVV..","..KKKKKKYKKKKK..","..JJJJJJJJJJJJ..","..JJJJJ..JJJJJ..","..JJJJJ..JJJJJ..","..JJJJ....JJJJ..","..JJJJ....JJJJ..",".KKKKK....KKKKK."];
const KLEGS_B = ["..VVVTTTTTTVVV..","..KKKKKKYKKKKK..","..JJJJJJJJJJJJ..","..JJJJJ..JJJJJ..",".JJJJ.....JJJJ..",".JJJJ......JJJJ.",".JJJJ......JJJJ.","KKKKK......KKKKK"];
const KFULL_A = KHAR.concat(KLEGS_A), KFULL_B = KHAR.concat(KLEGS_B);
const KPAL = {K:'#151515',R:'#d02030',H:'#121212',S:'#e0a070',G:'#101018',W:'#8af',B:'#202020',M:'#6a0a10',V:'#2a2a2a',T:'#6a1520',A:'#3a6ad0',J:'#2a3a5a',Y:'#e0c040'};

const HEADS = {
  short:["...HHHHHH...","..HHHHHHHH..","..HSSSSSSH..","..SSKSSKSS..","..SSSSSSSS..","...SSMMSS...","....SSSS...."],
  bob:  ["..HHHHHHHH..",".HHHHHHHHHH.",".HHSSSSSSHH.",".HSSKSSKSSH.",".HSSSSSSSSH.",".HHSSMMSSHH.","..H.SSSS.H.."],
  long: ["...HHHHHH...","..HHHHHHHH..",".HHSSSSSSHH.",".HSSKSSKSSH.",".HSSSSSSSSH.",".HHSKMMKSHH.",".HH.SSSS.HH."],
  hat:  ["..KKKKKKKK..",".KKKKKKKKKK.","..SSSSSSSS..","..SKKSSKKS..","..SSSSSSSS..","...SSMMSS...","....SSSS...."],
  bald: ["............","...SSSSSS...","..SSSSSSSS..","..SSKSSKSS..","..SSSSSSSS..","...SSMMSS...","....SSSS...."],
  cap:  ["....RRRR....","...RRRRRR...","..HSSSSSSH..","..SSKSSKSS..","..SSSSSSSS..","...SSMMSS...","....SSSS...."],
};
const BODY_TOP = ["..CCCCCCCC..",".CCCDCCDCCC.",".SCCCCCCCCS.",".SCDCCCDCCS.",".SCCCDCCCCS.","..CCCCCCCC..","..PPPPPPPP.."];
const BODY_A = BODY_TOP.concat(["..PPP..PPP..","..PPP..PPP..","..PPP..PPP..","..FFF..FFF.."]);
const BODY_B = BODY_TOP.concat(["..PPP..PPP..",".PPP....PPP.",".PPP....PPP.",".FFF....FFF."]);

const TYPES = {
  turist:  {head:'short', good:'key',  pal:{H:'#d8a040',S:'#f0c090',C:'#ff6aa8',D:'#ffe14a',P:'#e8d8a0',F:'#7a4a2a'},
            lines:["Oda lütfen!","Havuz nerede?","Selfie çekelim mi?","Kahvaltı var mı?"]},
  karen:   {head:'bob',   good:'slap', pal:{H:'#f0d060',S:'#f4c8a0',C:'#9a50e0',P:'#2a2a3a',F:'#111'},
            lines:["MÜDÜRÜ ÇAĞIR!","Bu ne rezalet?!","Ben VIP'im!","Şikayet edeceğim!"]},
  zilci:   {head:'bald',  good:'slap', pal:{S:'#e8b080',C:'#3a9a4a',P:'#5a4a3a',F:'#222'},
            lines:["DING DING!","Helloooo?","Kimse yok mu?","Zil çalıyorum!"]},
  metalci: {head:'long',  good:'key',  pal:{H:'#111',S:'#e0b090',C:'#151515',D:'#ddd',P:'#2a3a6a',F:'#111'},
            lines:["\\m/ Oda var mı?","Selam kanka!","Slayer açsana!","Metal 4 ever!"]},
  mufettis:{head:'hat',   good:'key',  pal:{S:'#e8c0a0',C:'#505060',P:'#3a3a48',F:'#111'},
            lines:["Teftiş!","Hijyen kontrolü.","Hmm... not alıyorum."]},
  necmi:   {head:'cap',   good:null,   pal:{R:'#c02030',H:'#5a3a1a',S:'#f0c090',C:'#b02030',D:'#e0c040',P:'#222',F:'#111'}, lines:[]},
};
for (const k in TYPES) {
  const p = TYPES[k].pal;
  p.K = p.K || '#111'; p.M = p.M || '#a03030'; p.W = p.W || '#fff';
  p.D = p.D || p.C; p.H = p.H || p.S;
  TYPES[k].rowsA = HEADS[TYPES[k].head].concat(BODY_A);
  TYPES[k].rowsB = HEADS[TYPES[k].head].concat(BODY_B);
}

const SKULL = ["..WWWWWW..",".WWWWWWWW.","WWWWWWWWWW","WW..WW..WW","WW..WW..WW","WWWWWWWWWW",".WWW..WWW.","..WWWWWW..","..W.W.W.W.","..WWWWWW.."];

const MUTTERS = ["Sıkıldııım...","Motoruma binsem ya...","METAAAAL!","Kimse yok mu lan?","Hıııh...","Biri gelsin de tokatlayayım.","STYGIAN açayım mı?","HUEHEHE... sıkıldım."];
const SLAPW = ["ŞAAAK!","PAAT!","ŞLAK!","TOKAAAT!","ÇAAT!"];
const KHAR_SLAP = ["AL BAKALIM!","SIRADAKİ!","OTUR YERİNE!","HAHA!","DEFOL!"];
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- AUDIO ----------
let AC = null, master;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = .3, when = 0, slide = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol = .5, freq = 1500, when = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + when, n = AC.sampleRate * dur | 0;
  const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .8;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
let distC;
function distCurve() {
  if (distC) return distC;
  const n = 1024; distC = new Float32Array(n);
  for (let i = 0; i < n; i++) distC[i] = Math.tanh((i * 2 / n - 1) * 20);
  return distC;
}
// distorted guitar note with a little vibrato
function dNote(f, d, when = 0, vol = .5) {
  if (!AC) return;
  const ws = AC.createWaveShaper(); ws.curve = distCurve();
  const g = AC.createGain(); g.gain.value = .12; ws.connect(g); g.connect(master);
  const t0 = AC.currentTime + when, o = AC.createOscillator(), og = AC.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t0);
  const v = AC.createOscillator(), vg = AC.createGain();
  v.frequency.value = 7; vg.gain.value = f * .02; v.connect(vg); vg.connect(o.frequency);
  og.gain.setValueAtTime(vol, t0); og.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(og); og.connect(ws); o.start(t0); o.stop(t0 + d); v.start(t0); v.stop(t0 + d);
}
const sSlap  = () => { noise(.15, 1, 2500); tone(160, .12, 'square', .4, 0, 60); };
const sPunch = () => { noise(.25, 1.2, 600); tone(90, .3, 'square', .5, 0, 40); };
const sKlang = () => { tone(620, .35, 'square', .15, 0, 300); noise(.3, .4, 3000); };
const sGrowl = () => { tone(120, .5, 'sawtooth', .25, 0, 70); tone(125, .5, 'square', .1, 0, 75); };
const sWhiff = () => noise(.12, .25, 800);
const sKey   = () => { tone(880, .08, 'square', .2); tone(1320, .12, 'square', .2, .08); };
const sDing  = () => { tone(1760, .5, 'sine', .25); tone(2640, .3, 'sine', .08); };
const sBad   = () => { tone(220, .15, 'sawtooth', .25); tone(160, .3, 'sawtooth', .25, .15); };
function sLaugh(big) {
  const n = big ? 12 : 5;
  for (let i = 0; i < n; i++) {
    const f = (i % 3 === 2 ? 520 : 300 + Math.random() * 180) * (big && i > n - 4 ? 1.6 : 1);
    tone(f, .08, 'square', .22, i * .1, f * .7);
  }
}
function sRiff() {
  if (!AC) return;
  const ws = AC.createWaveShaper(); ws.curve = distCurve();
  const g = AC.createGain(); g.gain.value = .16; ws.connect(g); g.connect(master);
  const pat = [[82.4,.1],[82.4,.1],[82.4,.1],[98,.1],[82.4,.1],[110,.1],[103.8,.3]];
  let w = 0;
  for (const [f, d] of pat) {
    for (const m of [1, 1.5]) {
      const t0 = AC.currentTime + w, o = AC.createOscillator(), og = AC.createGain();
      o.type = 'sawtooth'; o.frequency.value = f * m * 2;
      og.gain.setValueAtTime(.6, t0); og.gain.exponentialRampToValueAtTime(.001, t0 + d * .95);
      o.connect(og); og.connect(ws); o.start(t0); o.stop(t0 + d);
    }
    w += d;
  }
}
function sGuitar() {
  dNote(164.8, .6); dNote(247, .6);
  const solo = [330, 392, 440, 494, 587, 659, 587, 494, 659, 784, 880, 988];
  solo.forEach((f, i) => dNote(f, .16, .25 + i * .12));
  dNote(1318, .8, .25 + solo.length * .12);
}
const sEngine = () => { tone(50, 2.5, 'sawtooth', .3, 0, 180); tone(52, 2.5, 'square', .12, 0, 175); };

// ---------- STATE ----------
let best = 0;
try { best = +localStorage.getItem('khar-best') || 0; } catch (e) {}
let state = 'title', clock = 0;
let t, score, boredom, complaints, combo, queue, leavers, floats, parts, notes;
let spawnT, slapT, laughT, bangT, muttT, shake, bellT, elevT, overT, overReason;
let guitarT, guitarCD, noteT, esc;

function reset() {
  t = 0; score = 0; boredom = 30; complaints = 0; combo = 0;
  queue = []; leavers = []; floats = []; parts = []; notes = [];
  spawnT = 1; slapT = 0; laughT = 0; bangT = 0; muttT = 2.5; shake = 0; bellT = 0; elevT = 0;
  overT = 0; overReason = ''; guitarT = 0; guitarCD = 0; noteT = 0; esc = null;
}
reset();

function start() { reset(); state = 'play'; sRiff(); addFloat("İŞ BAŞINA KHAR!", 256, 92, '#ffe14a', 8); }

function addFloat(txt, x, y, col = '#fff', size = 6, life = 1.2) { floats.push({txt, x, y, col, size, life, vy: -18}); }
function burst(x, y, n, cols) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 90;
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: .5 + Math.random() * .4, col: pick(cols)});
  }
}

function pickType() {
  const w = [['turist', 30], ['karen', 22], ['zilci', 18], ['metalci', 15]];
  if (t > 20) w.push(['mufettis', 9]);
  let r = Math.random() * w.reduce((a, b) => a + b[1], 0);
  for (const [k, v] of w) if ((r -= v) < 0) return k;
  return 'turist';
}
function spawn() {
  if (queue.length >= 5) return;
  const type = pickType();
  queue.push({type, x: 14, y: 124, line: pick(TYPES[type].lines), pat: 0,
    patMax: Math.max(3.5, 8 - t * .04), walk: 0, arrived: false, ding: .4, alpha: 0});
}

function laugh(big) {
  laughT = big ? 1.6 : .8;
  sLaugh(big);
  addFloat(big ? "HÖHÖHÖ-AHAHUEHEHEEE!" : pick(["HUEHEHE!", "HÖHÖHÖ!", "AHAHAHAAA!"]), 256, 88, '#ffe14a', big ? 8 : 6, big ? 1.8 : 1.1);
}

function airGuitar() {
  if (guitarT > 0) return;
  if (guitarCD > 0) { addFloat("Gitar soğuyor...", 256, 92, '#aaa', 5, 1); return; }
  guitarT = 2.2; guitarCD = 12; noteT = 0;
  boredom = clamp(boredom - 12, 0, 100); score += 10;
  sGuitar();
  addFloat("HAVA GİTARI SOLOSU!", 256, 86, '#c080ff', 7, 1.6);
}

function act(kind) {
  if (state === 'title') { start(); return; }
  if (state === 'escape') { if (esc.t > 1) finishEscape(); return; }
  if (state === 'over') { if (overT > 1) start(); return; }
  if (kind === 'guitar') { airGuitar(); return; }
  guitarT = 0;
  if (kind === 'slap') slapT = .2;
  const g = queue[0];
  if (!g || !g.arrived) {
    if (kind === 'slap') { sWhiff(); addFloat(pick(["Hava tokatı!", "Fıss!", "Kimse yok..."]), 200, 112, '#aaa'); }
    return;
  }
  queue.shift();
  const right = TYPES[g.type].good === kind;
  if (kind === 'slap') {
    sSlap(); shake = .25; burst(180, 128, 14, ['#fff', '#ffe14a', '#ff5050']);
    g.mode = 'fly'; g.vx = -260 - Math.random() * 80; g.vy = -150; g.rot = 0; g.vr = -12;
    leavers.push(g);
    addFloat(pick(SLAPW), 178, 108, '#fff', 10, .9);
    if (right) {
      const p = g.type === 'karen' ? 30 : 20;
      score += p; boredom -= 25; combo++;
      addFloat('+' + p, 160, 122, '#7f7');
      if (Math.random() < .5) addFloat(pick(KHAR_SLAP), 256, 92, '#ffb050');
    } else {
      complaints += g.type === 'mufettis' ? 2 : 1; boredom -= 15; combo = 0; sBad();
      addFloat(g.type === 'mufettis' ? "RAPOR EDİLDİN!" : "ŞİKAYET!", 160, 96, '#ff4040', 8, 1.5);
    }
  } else {
    sKey(); g.mode = 'key'; g.walk = 0; leavers.push(g);
    if (right) {
      const p = g.type === 'metalci' ? 30 : 15;
      score += p; combo++; boredom -= g.type === 'metalci' ? 30 : 12;
      addFloat('+' + p, 160, 116, '#7f7');
      if (g.type === 'metalci') { bangT = 1.3; sRiff(); addFloat("\\m/ METAAAL! \\m/", 256, 92, '#ff5050', 7, 1.5); }
    } else {
      boredom += 15; combo = 0;
      addFloat("Bunu tokatlamalıydın...", 200, 96, '#aaa', 5, 1.5);
    }
  }
  if (right && combo > 0 && combo % 5 === 0) {
    laugh(true); score += 50; boredom -= 40; sRiff();
    addFloat('KOMBO x' + combo + '! +50', 160, 70, '#ffe14a', 8, 1.6);
  } else if (right && kind === 'slap' && Math.random() < .35) laugh(false);
  boredom = clamp(boredom, 0, 100);
  if (complaints >= 3) gameOver('fired');
}

function saveBest() {
  if (score > best) { best = score; try { localStorage.setItem('khar-best', best); } catch (e) {} }
}
function gameOver(reason) {
  saveBest(); overReason = reason; overT = 0;
  if (reason === 'bored') {
    // cut to the street: Khar storms out to his chopper
    state = 'escape'; floats = []; parts = []; notes = []; laughT = 0; shake = 0;
    esc = {t: 0, kx: 40, walking: false, punchT: 0, mounted: false, bikeX: 176, bikeV: 0,
      cw: {x: 44, y: 124, vis: false, fly: false, inCan: false, vx: 0, vy: 0, rot: 0}};
  } else {
    state = 'over'; sBad(); tone(110, .8, 'sawtooth', .25, .4, 40);
  }
}
function finishEscape() { state = 'over'; overT = 0; esc.t = 99; esc.bikeX = 400; }

// ---------- UPDATE ----------
function updateEscape(dt) {
  const e = esc, prev = e.t;
  e.t += dt;
  const T = e.t, at = s => prev < s && T >= s;
  e.walking = false;
  e.punchT = Math.max(0, e.punchT - dt);

  if (T > .4 && T < 2.0) { e.kx = Math.min(150, e.kx + 70 * dt); e.walking = true; }
  if (at(.8)) e.cw.vis = true;
  if (at(1.2)) tone(300, .1, 'square', .12);
  if (at(2.0)) { sGrowl(); addFloat("NE DEDİN SEN?!", e.kx + 16, 92, '#ff4040', 8, 1.4); }
  if (T > 2.5 && T < 3.4) { e.kx = Math.max(72, e.kx - 95 * dt); e.walking = true; }
  if (at(3.4)) {
    e.punchT = .35; sPunch(); shake = .4;
    burst(66, 132, 18, ['#fff', '#ffe14a', '#ff5050']);
    addFloat("GÜÜÜM!", 60, 104, '#fff', 12, 1);
    Object.assign(e.cw, {fly: true, vx: -120, vy: -170});
  }
  if (at(3.9)) laugh(true);
  if (T > 4.6 && T < 5.6) { e.kx = Math.min(168, e.kx + 100 * dt); e.walking = true; }
  if (at(5.6)) { e.mounted = true; sEngine(); addFloat("VROOOOOM!", 230, 100, '#ff5050', 8, 2); }
  if (T > 5.9) {
    e.bikeV += 140 * dt; e.bikeX += e.bikeV * dt;
    if (Math.random() < .6) parts.push({x: e.bikeX + 6, y: 150, vx: -20 - Math.random() * 20, vy: -10, g: -15, life: .8, col: pick(['#666', '#888', '#555'])});
  }
  const c = e.cw;
  if (c.fly) {
    c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 420 * dt; c.rot -= 10 * dt;
    if (c.x <= 6) { c.fly = false; c.inCan = true; sKlang(); shake = .2; addFloat("KLANG!", 18, 112, '#ccc', 6, 1); }
  }
  if (T >= 8.5) finishEscape();
}

function update(dt) {
  clock += dt;
  slapT = Math.max(0, slapT - dt); laughT = Math.max(0, laughT - dt); bangT = Math.max(0, bangT - dt);
  shake = Math.max(0, shake - dt); bellT = Math.max(0, bellT - dt); elevT = Math.max(0, elevT - dt);
  guitarT = Math.max(0, guitarT - dt); guitarCD = Math.max(0, guitarCD - dt);

  for (const f of floats) { f.y += f.vy * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g ?? 300) * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const n of notes) { n.y += n.vy * dt; n.x += Math.sin(n.life * 8) * 12 * dt; n.life -= dt; }
  notes = notes.filter(n => n.life > 0);

  if (state === 'escape') { updateEscape(dt); return; }

  for (const g of leavers) {
    if (g.mode === 'fly') {
      g.x += g.vx * dt; g.y += g.vy * dt; g.vy += 420 * dt; g.rot += g.vr * dt;
      if (g.y > 124 && g.vy > 0) { g.y = 124; g.vy *= -.45; g.vx *= .7; g.vr *= .6; }
      if (g.x < -40) g.dead = true;
    } else if (g.mode === 'key') {
      g.walk += dt;
      if (g.x > 59) g.x = Math.max(59, g.x - 70 * dt);
      else { g.mode = 'elev'; elevT = 1.2; tone(1320, .3, 'sine', .12); }
    } else if (g.mode === 'elev' || g.mode === 'gone') {
      g.alpha -= dt * 2; if (g.alpha <= 0) g.dead = true;
    } else if (g.mode === 'storm') {
      g.walk += dt; g.x -= 80 * dt;
      if (g.x < 16) g.mode = 'gone';
    }
  }
  leavers = leavers.filter(g => !g.dead);

  if (state === 'over') { overT += dt; return; }
  if (state !== 'play') return;

  t += dt;
  boredom += (4 + t * .05) * dt;
  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(1.1, 3.2 - t * .03) * (.7 + Math.random() * .6); }

  if (guitarT > 0) {
    noteT -= dt;
    if (noteT <= 0) {
      noteT = .15;
      notes.push({x: 244 + Math.random() * 30, y: 112, vy: -30 - Math.random() * 15, life: 1.3, col: pick(['#ff5aa0', '#ffe14a', '#7af', '#c080ff'])});
    }
  }

  const speed = 45 + t * .3;
  queue.forEach((g, i) => {
    const tx = 168 - i * 28;
    g.alpha = Math.min(1, g.alpha + dt * 3);
    if (g.x < tx) { g.x = Math.min(tx, g.x + speed * dt); g.walk += dt; } else g.walk = 0;
    g.arrived = i === 0 && g.x >= tx;
  });
  const g = queue[0];
  if (g && g.arrived) {
    g.pat += dt;
    if (g.type === 'zilci') {
      g.ding -= dt;
      if (g.ding <= 0) { g.ding = .8; sDing(); bellT = .25; boredom += 2; addFloat('DING!', 206, 122, '#ffe14a', 5, .7); }
    }
    if (g.pat >= g.patMax) {
      queue.shift(); g.mode = 'storm'; g.walk = 0; leavers.push(g);
      if (TYPES[g.type].good === 'key') {
        complaints++; combo = 0; sBad();
        addFloat("Berbat otel!", 150, 100, '#ff4040', 6, 1.4);
        if (complaints >= 3) { gameOver('fired'); return; }
      } else {
        boredom += 10; combo = 0;
        addFloat("Tokatı kaçırdın!", 150, 100, '#aaa', 5, 1.4);
      }
    }
  } else if (guitarT <= 0) {
    muttT -= dt;
    if (muttT <= 0) {
      muttT = 3 + Math.random() * 3;
      if (boredom > 75) addFloat(guitarCD <= 0 ? "ÇOK SIKILDIM! (C = GİTAR)" : "ÇOK SIKILDIM LAN!", 256, 92, '#ff4040', 6, 1.6);
      else addFloat(pick(MUTTERS), 256, 92, '#ccc', 5, 1.6);
    }
  }
  boredom = clamp(boredom, 0, 100);
  if (boredom >= 100) gameOver('bored');
}

// ---------- DRAW ----------
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function drawSprite(rows, pal, x, y, sc = 2) {
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const col = pal[row[c]];
      if (!col) continue;
      ctx.fillStyle = col; ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
    }
  }
}
function txt(s, x, y, size, col, align = 'left', ol = '#000') {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (ol) { ctx.fillStyle = ol; for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) ctx.fillText(s, x + dx * .67, y + dy * .67); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function wheel(cx, cy) {
  rect(cx - 3, cy - 5, 6, 10, '#0a0a0a'); rect(cx - 5, cy - 3, 10, 6, '#0a0a0a'); rect(cx - 4, cy - 4, 8, 8, '#0a0a0a');
  rect(cx - 2, cy - 2, 4, 4, '#555'); rect(cx - 1, cy - 1, 2, 2, '#bbb');
}
function drawChopper(x, y) {
  wheel(x + 5, y + 12); wheel(x + 31, y + 12);
  rect(x + 5, y + 6, 16, 2, '#1a1a1a');
  rect(x + 3, y + 11, 13, 2, '#ccc');
  rect(x + 11, y + 7, 7, 5, '#2a2a2a'); rect(x + 12, y + 8, 5, 1, '#666');
  rect(x + 6, y + 4, 8, 2, '#0a0a0a');
  rect(x + 13, y + 2, 7, 4, '#111'); rect(x + 14, y + 2, 4, 1, '#666');
  for (let i = 0; i < 10; i++) rect(x + 21 + i, y + 2 + i, 2, 2, '#ccc');
  rect(x + 20, y - 6, 1, 8, '#ccc'); rect(x + 18, y - 6, 3, 1, '#ccc');
  rect(x + 22, y + 1, 2, 2, '#ffd');
}
function drawChopperAt(x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); drawChopper(0, 0); ctx.restore();
}
function drawNote(n) {
  ctx.globalAlpha = Math.min(1, n.life / .4);
  rect(n.x, n.y, 3, 2, n.col); rect(n.x + 2, n.y - 5, 1, 5, n.col); rect(n.x + 3, n.y - 5, 2, 1, n.col);
  ctx.globalAlpha = 1;
}
function speech(s, cx, y, border, tag) {
  ctx.font = '5px ' + FONT;
  const tw = tag ? 10 : 0;
  const w = ctx.measureText(s).width + 8 + tw;
  const bx = clamp(cx - w / 2, 2, W - w - 2);
  rect(bx - 2, y - 2, w + 4, 16, border);
  rect(bx, y, w, 12, '#fff');
  rect(cx - 2, y + 12, 4, 2, '#fff'); rect(cx - 1, y + 14, 2, 2, '#fff');
  txt(s, bx + 4, y + 4, 5, '#000', 'left', null);
  if (tag) { rect(bx + w - 10, y + 2, 8, 8, border); txt(tag, bx + w - 6, y + 4, 5, '#fff', 'center', null); }
}

function drawFloats() {
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life / .3);
    ctx.font = f.size + 'px ' + FONT;
    const w = ctx.measureText(f.txt).width;
    txt(f.txt, clamp(f.x, w / 2 + 2, W - w / 2 - 2), f.y, f.size, f.col, 'center');
  }
  ctx.globalAlpha = 1;
}

function draw() {
  const sx = shake > 0 ? (Math.random() * 4 - 2) : 0, sy = shake > 0 ? (Math.random() * 4 - 2) : 0;
  ctx.setTransform(S, 0, 0, S, sx * S, sy * S);
  if (state === 'escape' || (state === 'over' && overReason === 'bored')) {
    drawEscape();
    for (const p of parts) rect(p.x, p.y, 2, 2, p.col);
    drawFloats();
    if (state === 'escape' && esc.t > 1) txt("Z = GEÇ", 316, 4, 4, '#777', 'right');
    if (state === 'over') drawOver();
    return;
  }
  drawRoom();
  drawKhar();
  drawDesk();
  if (state !== 'title') {
    for (let i = queue.length - 1; i >= 0; i--) drawGuest(queue[i]);
    for (const g of leavers) drawGuest(g);
    if (state === 'play') drawBubble();
    for (const p of parts) rect(p.x, p.y, 2, 2, p.col);
    for (const n of notes) drawNote(n);
    drawFloats();
    drawHUD();
  }
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
}

// ---------- INPUT ----------
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'z' || k === ' ' || k === 'a') { e.preventDefault(); initAudio(); act('slap'); }
  else if (k === 'x' || k === 'enter' || k === 's') { e.preventDefault(); initAudio(); act('key'); }
  else if (k === 'c' || k === 'd') { e.preventDefault(); initAudio(); act('guitar'); }
});
for (const [id, kind] of [['bSlap', 'slap'], ['bKey', 'key'], ['bGtr', 'guitar']])
  document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); act(kind); });
cv.addEventListener('pointerdown', () => { if (state !== 'play') { initAudio(); act('slap'); } });

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
